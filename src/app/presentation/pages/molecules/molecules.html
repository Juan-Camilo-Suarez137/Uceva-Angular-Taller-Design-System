<dsb-container-atom title="Button Group" >
    <dsb-button-group-molecule 
        [buttonsGroupData]="buttonsGroupData" 
        (clicker)="onClick($event)" >
    </dsb-button-group-molecule>
</dsb-container-atom>

<dsb-container-atom title="Nav Link" >
    <dsb-nav-link-molecule [navLinks]="navLinks">
    </dsb-nav-link-molecule>
</dsb-container-atom>

<dsb-container-atom title="Form Field" >
        <section class="d-grid gap-3">
            @for (field of formFieldSamples; track field.label) {
                <dsb-form-field-molecule
                    [label]="field.label"
                    [placeholder]="field.placeholder"
                    [value]="field.value"
                    [theme]="field.theme"
                    [helperText]="field.helperText"
                    [disabled]="field.disabled">
                </dsb-form-field-molecule>
            }
        </section>
</dsb-container-atom>

<dsb-container-atom title="Search Box" >
        <section class="d-grid gap-3">
            @for (sample of searchBoxSamples; track sample.placeholder) {
                <dsb-search-box-molecule
                    [placeholder]="sample.placeholder"
                    [value]="sample.value"
                    [theme]="sample.theme"
                    [icon]="sample.icon"
                    [buttonText]="sample.buttonText"
                    (search)="onSearch($event)">
                </dsb-search-box-molecule>
            }
        </section>
</dsb-container-atom>
